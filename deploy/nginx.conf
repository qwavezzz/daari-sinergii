# Install after obtaining the certificate for both hosts. The default vhost rejects unknown Host.
# This file is included inside nginx's http context (sites-enabled on Ubuntu).
limit_req_zone $binary_remote_addr zone=dari_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=dari_order:10m rate=20r/m;
upstream dari_application { server unix:/run/dari/gunicorn.sock; }

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name dari-sinergii.ru shop.dari-sinergii.ru www.dari-sinergii.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/dari-sinergii.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dari-sinergii.ru/privkey.pem;
    return 444;
}
server {
    listen 443 ssl;
    server_name www.dari-sinergii.ru;
    ssl_certificate /etc/letsencrypt/live/dari-sinergii.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dari-sinergii.ru/privkey.pem;
    return 301 https://dari-sinergii.ru$request_uri;
}
server {
    listen 443 ssl http2;
    server_name dari-sinergii.ru shop.dari-sinergii.ru;
    ssl_certificate /etc/letsencrypt/live/dari-sinergii.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dari-sinergii.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/static/(assets/)?documents/ { return 404; }
    location /private-media/ { return 404; }
    location /static/dist/ {
        alias /srv/dari/shared/static/dist/;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /static/ {
        alias /srv/dari/shared/static/;
        expires 1h;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
    }
    # Files behind publication checks may optionally use X-Accel-Redirect.
    location /_private/ {
        internal;
        alias /srv/dari/shared/private-media/;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /admin/login/ {
        limit_req zone=dari_login burst=5 nodelay;
        include /etc/nginx/snippets/dari-proxy.conf;
    }
    location ~ ^/(checkout/|orders/[^/]+/(pay|refresh)/)$ {
        limit_req zone=dari_order burst=10 nodelay;
        include /etc/nginx/snippets/dari-proxy.conf;
    }
    # Webhooks must reach Django without user-operation throttles or HTML caching.
    location / { include /etc/nginx/snippets/dari-proxy.conf; }
}
