# ens3: keep the verified resolvers instead of the stale provider DNS answer.
# /etc/systemd/network/10-netplan-ens3.network.d/90-dari-dns.conf
# Reset DNS inherited from the generated network file before setting our list.
[Network]
DNS=
DNS=1.1.1.1 8.8.8.8

[DHCPv4]
UseDNS=no

[DHCPv6]
UseDNS=no

[IPv6AcceptRA]
UseDNS=no
