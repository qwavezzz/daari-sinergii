{% if homepage_reviews %}
<section class="reviews section-pad tw:grid tw:gap-y-16 tw:bg-[var(--ink)] tw:py-24 tw:lg:grid-cols-12 tw:lg:gap-x-5 tw:lg:py-32" id="reviews" aria-labelledby="reviews-title" data-scroll-snap>
  <h2 id="reviews-title" class="tw:max-w-[12ch] tw:text-[clamp(48px,6vw,88px)] tw:leading-[.94] tw:tracking-[-.04em] tw:lg:col-span-5">Отзывы о продукции</h2>
  <div class="reviews-list tw:grid tw:gap-12 tw:lg:col-span-7">
    {% for review in homepage_reviews %}{% include "site/partials/review_item.html" with review_surface="landing" %}{% endfor %}
  </div>
</section>
{% endif %}
