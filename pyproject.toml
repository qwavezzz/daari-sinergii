[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".tmp", ".venv", "var", "node_modules", ".agents", ".git", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"config/settings_dev.py" = ["F405"]
"config/settings_test.py" = ["F405"]
"scripts/browser_server.py" = ["E402"]
"scripts/export-pages.py" = ["E402"]
