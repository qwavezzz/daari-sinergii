[tool.ruff]
target-version = "py312"
line-length = 110
cache-dir = "var/cache/ruff"
extend-exclude = [".venv", "var", "node_modules", ".agents", ".git"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"config/settings_dev.py" = ["F405"]
"config/settings_test.py" = ["F405"]
"tests/browser/server.py" = ["E402"]
"scripts/pages/export.py" = ["E402"]
